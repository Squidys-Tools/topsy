[package]
name = "topsy"
version = "0.1.0"
edition = "2024"
description = "A Droppy-style notch/island for Windows: jiggle a drag to get a file tray"
license = "MIT"
repository = "https://github.com/Squidys-Tools/topsy"

[lints]
workspace = true

[dependencies]
# The rules: pure, so they build and test without GPUI or Win32.
model = { package = "topsy-model", path = "crates/model" }
async-channel = "2"
gpui = "0.2.2"
# Background removal runs BiRefNet on the CPU: matrix products through gemm (pure Rust SIMD), spread with rayon.
gemm = { version = "0.19", default-features = false, features = ["std", "rayon"] }
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "webp", "bmp", "tiff", "gif"] }
# Transform: PDFs are rewritten with lopdf and drawn by pdfium, loaded from a downloaded pdfium.dll.
lopdf = { version = "0.47", default-features = false }
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "image_025", "thread_safe"] }
# Unpacking downloaded tools: .tar.gz (pdfium) and .7z (ImageMagick; LZMA2 with BCJ2).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
sevenz-rust2 = { version = "0.25", default-features = false }
tar = { version = "0.4", default-features = false }
raw-window-handle = "0.6"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_IO", "Win32_UI_Shell_PropertiesSystem", "Win32_Networking_WinHttp", "Win32_UI_WindowsAndMessaging", "Win32_System_Ole", "Win32_System_Com", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_Globalization", "Win32_System_Wmi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_FileSystem", "Win32_UI_Shell_Common", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "System", "UI_Composition", "UI_Composition_Desktop", "Foundation", "Media", "Media_Control", "Storage", "Storage_Search", "Storage_Streams", "Graphics_Imaging", "ApplicationModel_DataTransfer", "Devices_Geolocation"] }
windows-collections = "0.3"
windows-core = "0.62"
windows-numerics = "0.3"
# Compress to .zip: deflate only, through flate2 and zlib-rs (pure Rust).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }


[dev-dependencies]
model = { package = "topsy-model", path = "crates/model", features = ["test-support"] }

[workspace]
members = ["crates/model"]

# CI and scripts/check.ps1 deny warnings, so these fail the build there.
[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# A panic takes the whole island down: outside tests, propagate, log or encode the invariant.
unwrap_used = "warn"
expect_used = "warn"
# A discarded Result is an error nobody hears about: log it, propagate it, or say why not.
let_underscore_must_use = "warn"
redundant_clone = "warn"
ignore_without_reason = "warn"
