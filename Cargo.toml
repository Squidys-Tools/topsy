[package]
name = "topsy"
version = "0.1.0"
edition = "2024"
description = "A Droppy-style notch/island for Windows: jiggle a drag to get a file tray"
license = "MIT"
repository = "https://github.com/Squidys-Tools/topsy"

# CI and scripts/check.ps1 deny warnings, so these fail the build there.
[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
async-channel = "2"
gpui = "0.2.2"
image = { version = "0.25", default-features = false }
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Ole", "Win32_System_Com", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_Security", "Win32_UI_Shell_Common", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "System", "UI_Composition", "UI_Composition_Desktop"] }
windows-core = "0.62"
windows-numerics = "0.3"
# Compress to .zip: deflate only, through flate2 and zlib-rs (pure Rust).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
