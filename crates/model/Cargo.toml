[package]
name = "topsy-model"
version = "0.1.0"
edition = "2024"
description = "topsy's rules: no Win32, no GPUI, no clock and no environment"
license = "MIT"
publish = false

[lints]
workspace = true

[lib]
name = "model"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
# Tests decode what the JPEG writer made.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[features]
# Helpers and labels only tests use, for topsy's own tests too.
test-support = []
